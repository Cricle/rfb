[package]
# Published as `rfb-sdk`: crates.io bare name `rfb` is occupied by an unrelated
# 2022 crate. The lib target keeps the name `rfb` so all `use rfb::` code and
# the `rfb-cli` binary are unchanged.
name = "rfb-sdk"
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cricle/rfb"
description = "RFB sandbox contracts and integrations"

[lib]
name = "rfb"
path = "src/lib.rs"

[features]
default = []
forkd = ["dep:reqwest", "dep:tokio", "dep:url"]
# The ZBRT V1 protocol types live in rfb-runtime (`zeroboot_protocol`); `rfb`
# re-exports them so host/provider consumers share one wire implementation
# without a `rfb` <-> `rfb-runtime` dependency cycle.
zeroboot = ["dep:anyhow", "dep:tokio", "dep:tokio-vsock", "dep:uuid", "dep:rfb-runtime", "dep:tempfile"]
# The CLI reuses the runtime's RFB1 framed codec and session contract for its
# rfb1 acceptance/verify commands instead of reimplementing the wire format.
cli = ["dep:clap", "dep:sha2", "dep:rfb-runtime", "rfb-runtime/host-vsock", "forkd", "zeroboot"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"], optional = true }
url = { version = "2", optional = true }
anyhow = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rfb-runtime = { path = "../rfb-runtime", version = "0.0.1", optional = true, default-features = false, features = ["core"] }
# Only the zeroboot provider (and, through it, the cli feature) uses
# tempfile; keep it out of lean builds.
tempfile = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }

[[bin]]
name = "rfb-cli"
path = "src/bin/rfb-cli.rs"
required-features = ["cli"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt", "net", "io-util", "time"] }
futures-lite = "2"
tempfile = "3"
