[package]
name = "rfb-rig"
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cricle/rfb"
description = "Rig integration for RFB sandbox testing"
keywords = ["sandbox", "rig", "llm", "tools"]
categories = ["development-tools::testing", "api-bindings"]

[dependencies]
rfb = { package = "rfb-sdk", path = "../rfb", version = "0.0.1" }
rig-core = { version = "0.42", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures = "0.3"
