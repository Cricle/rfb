[package]
name = "rfb-rig"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PLACEHOLDER_ORG/rfb"
description = "Rig integration for RFB sandbox testing"

[dependencies]
rfb = { path = "../rfb", version = "0.1.0" }
rig-core = { version = "0.42", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures = "0.3"
