[package]
name = "rfb-rig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rig integration for RFB sandbox testing"
keywords = ["sandbox", "rig", "llm", "tools"]
categories = ["development-tools::testing", "api-bindings"]

[dependencies]
rfb = { workspace = true }
rig-core = { version = "0.42", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures = "0.3"
