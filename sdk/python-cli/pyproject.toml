[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfb-cli"
version = "0.0.1"
description = "RFB CLI (rfb-cli) — prebuilt native binary for linux-x64"
readme = "README.md"
requires-python = ">=3"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Cricle", email = "qnydhuaji@gmail.com" }]
urls = { Homepage = "https://github.com/Cricle/rfb" }

[project.scripts]
rfb-cli = "rfb_cli.__main__:main"

[tool.setuptools]
packages = ["rfb_cli"]

[tool.setuptools.package-data]
rfb_cli = ["_bin/*"]
