[package]
name = "rfb-quickstart"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
# The lib target is named `rfb` (see rfb/Cargo.toml [lib] name); the package
# alias `rfb` lets us `use rfb::...` in code.
rfb = { package = "rfb-sdk", version = "0.0.1", features = ["forkd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[workspace]
