[package]
name = "rfb-ben"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cricle/rfb"
description = "RFB sandbox capacity benchmarks: real-VM ZBRT concurrency and memory ladders"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rfb = { package = "rfb-sdk", path = "../rfb", version = "0.0.1", features = ["zeroboot"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
