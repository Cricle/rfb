# RFB SDK 全新 Debian 环境 E2E：在 debian:12 容器里从零安装 Python / .NET / Java
# 工具链并跑齐三个 SDK 测试套件，与 sdk/e2e/debian-e2e.sh、sdk/e2e/README.md 对应。
# 与 e2e.yml 保持同一约定：本工作流随 rfb 子树作为独立 GitHub 仓库推送时，
# checkout 根目录即 rfb 工作区（sdk/ 所在地），因此脚本用相对路径即可执行。
#
# 无任何 secret：脚本与套件均不消费凭据。测试为纯 CPU 任务，用并发组排队，
# 避免两次运行并行争抢 runner 资源。

name: RFB SDK Debian E2E

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'   # 每周一 02:30 UTC 例行回归，防止 SDK 测试悄悄腐化

permissions:
  contents: read

concurrency:
  group: rfb-sdk-debian-e2e
  cancel-in-progress: false

jobs:
  sdk-e2e:
    name: SDK E2E (debian:12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:12   # 与本地 WSL 验证环境（rfb-e2e-debian，Debian 12 bookworm）同源
      # GH Actions 宿主的 systemd-resolved（127.0.0.53）在容器内不可达，
      # apt 域名解析会失败；显式指公共 DNS。
      options: --dns 8.8.8.8
    env:
      # 把脚本日志/汇总指到工作区内固定路径，供最后的 artifact 步骤上传
      E2E_OUT_DIR: ${{ github.workspace }}/sdk-e2e-out
    steps:
      # debian:12 精简镜像连 git 都没有；actions/checkout 虽能回退到 API 下载，
      # 但装上 git 更稳（完整 clone，保留 checkout 语义）。
      # 显式 shell: bash：debian:12 没有 which 命令，runner 探测 bash 失败会
      # 回退到 sh（dash），而 dash 不支持 `set -o pipefail`，会立即以 exit 2
      # 秒退 —— 这正是此前 apt 步骤无日志秒败的根因。
      - name: Install git（debian:12 精简镜像自带工具极少）
        shell: bash
        run: |
          set -euo pipefail
          # 失败现场要能被公开 API 读到（日志下载需 token）：把诊断与 apt
          # 输出拆成 ::error:: 注解带出来。
          emit_diag() {
            local f="$1" t="$2" data
            data=$(LC_ALL=C tr '\r\n' '::' < "$f" | LC_ALL=C tr -d '%')
            local n=${#data} i=0 c=1
            while [ "$i" -lt "$n" ]; do
              echo "::error title=$t-$c::${data:i:700}"
              i=$((i+700)); c=$((c+1))
            done
          }
          diag=/tmp/sdk-e2e-diag.txt
          {
            echo "== resolv.conf before =="
            cat /etc/resolv.conf
            echo "== getent deb.debian.org =="
            getent hosts deb.debian.org
            echo "getent rc=$?"
          } > "$diag" 2>&1 || true
          # 无条件改写公共 DNS：条件式改写覆盖不到 getent 成功但 apt 仍失败的
          # 场景；resolv.conf 在同一 job 容器内跨步骤保留，后续 debian-e2e.sh
          # 的 apt 同样受益。
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' > /etc/resolv.conf
          ok=0
          for attempt in 1 2; do
            if apt-get update -o Acquire::Retries=3 >> "$diag" 2>&1; then
              ok=1
              break
            fi
            echo "== apt-get update attempt $attempt failed, switch DNS ==" >> "$diag"
            printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\n' > /etc/resolv.conf
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            emit_diag "$diag" apt-update
            echo "::error::apt-get update 重试后仍失败（诊断见注解）"
            exit 1
          fi
          if ! apt-get install -y git >> "$diag" 2>&1; then
            emit_diag "$diag" apt-install
            echo "::error::apt-get install git 失败"
            exit 1
          fi
          git --version

      - uses: actions/checkout@v4

      # 依赖安装（apt：python3/maven 等；dotnet：官方安装脚本）与三个套件的
      # 执行全部内聚在脚本内。容器默认即 root，无需 sudo；跳过与退出码约定
      # 见脚本头部注释。
      # 注意：脚本自身把套件失败折叠为 rc=1，因此 rc=134 这类"进程被信号杀死"
      # 只可能来自脚本内未受保护的段落（如 ensure_dotnet）。失败时把完整日志
      # 尾部与各套件日志尾部拆成 ::error:: 注解带出（日志下载需 token）。
      - name: Run sdk/e2e/debian-e2e.sh
        shell: bash
        run: |
          set -uo pipefail
          emit_file() {
            tail -c "$3" "$1" 2>/dev/null \
              | tr '\r\n' '::' \
              | LC_ALL=C tr -d '%\000-\010\013\014\016-\037' \
              | LC_ALL=C fold -w 700 \
              | awk -v t="$2" '{print "::error title="t"-"NR"::"$0}'
          }
          log=/tmp/debian-e2e-full.log
          set +e
          bash sdk/e2e/debian-e2e.sh 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::debian-e2e.sh 失败 rc=$rc（完整日志在 job log / artifact，以下为尾部）"
            emit_file "$log" e2e-full 3000
            for f in "$PWD"/sdk-e2e-out/*.log "$PWD"/sdk-e2e-out/summary.txt; do
              [ -f "$f" ] || continue
              b="e2e-$(basename "$f")"
              emit_file "$f" "$b" 2000
            done
            exit "$rc"
          fi
          echo "debian-e2e.sh 全部通过"

      # 失败也要留证据：脚本汇总/逐套件日志 + C# trx + Java surefire XML。
      - name: Upload E2E summary and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-e2e-${{ github.run_id }}
          path: |
            sdk-e2e-out/
            sdk/csharp/**/TestResults/
            sdk/java/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
