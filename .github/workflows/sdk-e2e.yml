# RFB SDK 全新 Debian 环境 E2E：在 debian:12 容器里从零安装 Python / .NET / Java
# 工具链并跑齐三个 SDK 测试套件，与 sdk/e2e/debian-e2e.sh、sdk/e2e/README.md 对应。
# 与 e2e.yml 保持同一约定：本工作流随 rfb 子树作为独立 GitHub 仓库推送时，
# checkout 根目录即 rfb 工作区（sdk/ 所在地），因此脚本用相对路径即可执行。
#
# 无任何 secret：脚本与套件均不消费凭据。测试为纯 CPU 任务，用并发组排队，
# 避免两次运行并行争抢 runner 资源。

name: RFB SDK Debian E2E

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'   # 每周一 02:30 UTC 例行回归，防止 SDK 测试悄悄腐化

permissions:
  contents: read

concurrency:
  group: rfb-sdk-debian-e2e
  cancel-in-progress: false

jobs:
  sdk-e2e:
    name: SDK E2E (debian:12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:12   # 与本地 WSL 验证环境（rfb-e2e-debian，Debian 12 bookworm）同源
    env:
      # 把脚本日志/汇总指到工作区内固定路径，供最后的 artifact 步骤上传
      E2E_OUT_DIR: ${{ github.workspace }}/sdk-e2e-out
    steps:
      # debian:12 精简镜像连 git 都没有；actions/checkout 虽能回退到 API 下载，
      # 但装上 git 更稳（完整 clone，保留 checkout 语义）。
      - name: Install git（debian:12 精简镜像自带工具极少）
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq git

      - uses: actions/checkout@v4

      # 依赖安装（apt：python3/maven 等；dotnet：官方安装脚本）与三个套件的
      # 执行全部内聚在脚本内。容器默认即 root，无需 sudo；跳过与退出码约定
      # 见脚本头部注释。
      - name: Run sdk/e2e/debian-e2e.sh
        run: |
          set -euo pipefail
          bash sdk/e2e/debian-e2e.sh

      # 失败也要留证据：脚本汇总/逐套件日志 + C# trx + Java surefire XML。
      - name: Upload E2E summary and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-e2e-${{ github.run_id }}
          path: |
            sdk-e2e-out/
            sdk/csharp/**/TestResults/
            sdk/java/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
