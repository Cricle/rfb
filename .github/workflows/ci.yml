name: CI

# 同一 ref 的新推送会取消旧跑（PR 迭代场景），避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 触发约定：main 推送同时跑本工作流与 e2e.yml（真机 E2E 只在 e2e.yml 里跑）；
# 本工作流跑所有分支的推送（含 main）与所有 PR 的 Rust 门禁
# （fmt/clippy/test/doc，全部 --all-features），以及
# SDK 全量 build + 四套件测试（Python / C# / Java / Node.js，debian:12 干净容器）。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # 冷启动全特性编译（rustpython/mlua）约 8-12 分钟；rust-cache 复用
      # registry 与 target，key 跟随 Cargo.lock。
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # all-features 会启用 rustpython（libffi-sys）等系统链接依赖
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev e2fsprogs musl-tools
      # build_script_bakes_files_and_rust_apps_into_a_real_image（cli.rs）是
      # 工具门控测试：有 cargo+musl target+mke2fs/debugfs 才会真正执行
      # （静态 runtime 构建 + mke2fs/debugfs 组装 + debugfs 回读校验），
      # 否则静默 skip。这里把依赖装齐，让它在 CI 里跑起来。
      - name: Add musl target for tool-gated image tests
        run: rustup target add x86_64-unknown-linux-musl
      - name: Check test layout and framework boundary
        run: |
          bash scripts/check-tests-folder.sh
          bash scripts/check-boundary.sh
      - name: Format check
        run: |
          set -uo pipefail
          log=/tmp/fmt.log
          set +e
          cargo fmt --all -- --check 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo fmt 失败 rc=$rc（diff 尾部见注解）"
            bash scripts/ci-annotate.sh ci-fmt "$log" 2000
            exit "$rc"
          fi
      - name: Clippy
        run: |
          set -uo pipefail
          log=/tmp/clippy.log
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::clippy 失败 rc=$rc（error 行见注解）"
            grep -E "^error" "$log" | head -20 > /tmp/clippy-errs.txt || true
            bash scripts/ci-annotate.sh ci-clippy /tmp/clippy-errs.txt 0
            exit "$rc"
          fi
      # feature 矩阵：--all-features 只能证明“全开”可编译，单个 feature 的
      # lean 组合（no-default-features + 单 feature）可能因 cfg 门控/可选依赖
      # 漏配而漏编译（clippy/test 只跑 all-features，覆盖不到）。这里逐条跑
      # 最小组合，任一条失败立即停止（set -e + 循环内不吞错）。
      - name: Feature matrix (lean per-feature compile gates)
        run: |
          set -euo pipefail
          specs=(
            "-p rfb-sdk --no-default-features"
            "-p rfb-sdk --no-default-features --features forkd"
            "-p rfb-sdk --no-default-features --features zeroboot"
            "-p rfb-runtime --no-default-features"
            "-p rfb-runtime --no-default-features --features guest"
            "-p rfb-runtime --no-default-features --features host-vsock"
            "-p rfb-runtime --no-default-features --features firecracker"
            "-p rfb-runtime --no-default-features --features forkd"
            "-p rfb-runtime --no-default-features --features zeroboot"
          )
          for spec in "${specs[@]}"; do
            echo "== cargo check --locked $spec =="
            # shellcheck disable=SC2086 —— spec 是本步骤内的受控字面量，需要分词
            cargo check --locked $spec
          done
      # 失败现场要能被公开 API 读到（日志下载需 token）：失败时把 FAILED
      # 测试名、failures 块与 panic 信息拆成 ::error:: 注解带出。
      - name: Tests
        run: |
          set -uo pipefail
          log=/tmp/cargo-test.log
          set +e
          cargo test --workspace --all-features --locked 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "cargo test passed"
            exit 0
          fi
          {
            echo "== FAILED tests =="
            grep -E "^test .* FAILED|test result: FAILED" "$log" || true
            echo "== failures block =="
            awk '/^failures:$/{f=1} f' "$log" | head -40 || true
            echo "== panics =="
            grep -B1 -A6 "panicked at" "$log" | head -100 || true
            echo "== tail =="
            tail -c 1500 "$log"
          } > /tmp/test-diag.txt 2>&1
          echo "::error::cargo test 失败 rc=$rc（详情见注解）"
          bash scripts/ci-annotate.sh ci-test /tmp/test-diag.txt 0
          exit "$rc"
      - name: Documentation
        run: |
          set -uo pipefail
          log=/tmp/doc.log
          set +e
          RUSTDOCFLAGS='-D missing_docs -D warnings' \
            cargo doc --workspace --all-features --locked --lib --no-deps 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo doc 失败 rc=$rc（错误行与尾部见注解）"
            {
              grep -E '^error' "$log" | head -20 || true
              echo "== tail =="
              tail -c 1500 "$log"
            } > /tmp/doc-diag.txt 2>&1
            bash scripts/ci-annotate.sh ci-doc /tmp/doc-diag.txt 0
            exit "$rc"
          fi

  # SDK 全量验证：干净 debian:12 容器里从零装工具链，跑 Python/C#/Java/Node 四套件
  # 的 build + tests（脚本内聚，见 sdk/e2e/debian-e2e.sh）。
  # 显式 shell: bash：debian:12 没有 which 命令，runner 探测 bash 失败会回退到
  # sh（dash），而 dash 不支持 `set -o pipefail`，会立即以 exit 2 秒退。
  sdk:
    name: SDK build and tests (debian:12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:12
      options: --dns 8.8.8.8
    env:
      # 把脚本日志/汇总指到工作区内固定路径，供最后的 artifact 步骤上传
      E2E_OUT_DIR: ${{ github.workspace }}/sdk-e2e-out
    steps:
      # debian:12 精简镜像连 git 都没有；actions/checkout 虽能回退到 API 下载，
      # 但装上 git 更稳（完整 clone，保留 checkout 语义）。
      - name: Install git（debian:12 精简镜像自带工具极少）
        shell: bash
        run: |
          set -euo pipefail
          # 失败现场要能被公开 API 读到（日志下载需 token）：把诊断与 apt
          # 输出拆成 ::error:: 注解带出来。
          # 本步骤先于 actions/checkout，仓库脚本尚不可用：保持内联实现。
          emit_diag() {
            local f="$1" t="$2" data
            data=$(LC_ALL=C tr '\r\n' '::' < "$f" | LC_ALL=C tr -d '%')
            local n=${#data} i=0 c=1
            while [ "$i" -lt "$n" ]; do
              echo "::error title=$t-$c::${data:i:700}"
              i=$((i+700)); c=$((c+1))
            done
          }
          diag=/tmp/sdk-ci-diag.txt
          {
            echo "== resolv.conf before =="
            cat /etc/resolv.conf
            echo "== shell probe =="
            echo "shell0=$0 BASH_VERSION=${BASH_VERSION:-unset}"
            command -v bash || echo no-bash-in-path
            echo "== getent deb.debian.org =="
            rc=0
            getent hosts deb.debian.org || rc=$?
            echo "getent rc=$rc"
          } > "$diag" 2>&1 || true
          # 无条件改写公共 DNS：条件式改写覆盖不到 getent 成功但 apt 仍失败的
          # 场景；resolv.conf 在同一 job 容器内跨步骤保留，后续 debian-e2e.sh
          # 的 apt 同样受益。
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' > /etc/resolv.conf
          ok=0
          for attempt in 1 2; do
            if apt-get update -o Acquire::Retries=3 >> "$diag" 2>&1; then
              ok=1
              break
            fi
            echo "== apt-get update attempt $attempt failed, switch DNS ==" >> "$diag"
            printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\n' > /etc/resolv.conf
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            emit_diag "$diag" apt-update
            echo "::error::apt-get update 重试后仍失败（诊断见注解）"
            exit 1
          fi
          if ! apt-get install -y git >> "$diag" 2>&1; then
            emit_diag "$diag" apt-install
            echo "::error::apt-get install git 失败"
            exit 1
          fi
          git --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 依赖安装（apt：python3/libicu/maven 等；dotnet：官方安装脚本）与三个
      # 套件的执行全部内聚在脚本内。容器默认即 root，无需 sudo。
      # 注意：脚本自身把套件失败折叠为 rc=1，因此 rc=134 这类"进程被信号杀死"
      # 只可能来自脚本内未受保护的段落（如 ensure_dotnet）。失败时把完整日志
      # 尾部与各套件日志尾部拆成 ::error:: 注解带出（日志下载需 token）。
      - name: Run sdk/e2e/debian-e2e.sh
        shell: bash
        run: |
          set -uo pipefail
          emit_file() { bash scripts/ci-annotate.sh "$2" "$1" "$3"; }
          log=/tmp/debian-e2e-full.log
          set +e
          bash sdk/e2e/debian-e2e.sh 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::debian-e2e.sh 失败 rc=$rc（完整日志在 job log / artifact，以下为尾部）"
            emit_file "$log" e2e-full 3000
            for f in "$PWD"/sdk-e2e-out/*.log "$PWD"/sdk-e2e-out/summary.txt; do
              [ -f "$f" ] || continue
              b="e2e-$(basename "$f")"
              emit_file "$f" "$b" 2000
            done
            exit "$rc"
          fi
          echo "debian-e2e.sh 全部通过"

      # 失败也要留证据：脚本汇总/逐套件日志 + C# trx + Java surefire XML。
      - name: Upload E2E summary and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-sdk-e2e-${{ github.run_id }}
          path: |
            sdk-e2e-out/
            sdk/csharp/**/TestResults/
            sdk/java/tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    name: MSRV check (Rust 1.93)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.93.0
      # A fast compile-only check (no clippy/tests) to catch dependency MSRV regressions.
      # Dependabot may try to bump past the declared MSRV; this job fails before the
      # version reaches CI's all-features build.
      - name: cargo check –all-features
        run: cargo check --workspace --all-features --locked
