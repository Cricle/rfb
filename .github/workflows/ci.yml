name: CI

# 触发约定：main 推送由 e2e.yml 负责跑真机 E2E；本工作流只跑其余分支
# 的推送与所有 PR 的"简单测试"（fmt/clippy/test/doc，全部 --all-features）。
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # all-features 会启用 rustpython（libffi-sys）等系统链接依赖
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libffi-dev
      - name: Check test layout and framework boundary
        run: |
          bash scripts/check-tests-folder.sh
          bash scripts/check-boundary.sh
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Documentation
        run: RUSTDOCFLAGS='-D missing_docs -D warnings' cargo doc --workspace --all-features --lib --no-deps
