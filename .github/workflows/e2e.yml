# RFB 真机 forkd E2E（Real-VM）：在 KVM 可用的 GitHub runner 上驱动真实
# Firecracker/forkd 栈跑 tests/forkd_real_e2e.rs 的全部 #[ignore] 测试。
# 与 ci.yml 保持同一约定：本工作流随 rfb 子树作为独立 GitHub 仓库推送时，
# checkout 根目录即 rfb 工作区（Cargo.toml/resx/ 所在地），因此各步骤无需再
# 进入子目录。触发仅限 push 到 main 与 workflow_dispatch（按需求，不跑 PR）。
#
# 无任何 secret：forkd controller 不启用认证（不设 FORKD_TOKEN），凭据面为零。
# 真机测试需要独占 VM/网络资源：用并发组排队，避免两次运行互相踩踏。

name: RFB forkd real-VM E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfb-forkd-real-e2e
  cancel-in-progress: false

jobs:
  forkd-real-e2e:
    name: forkd real-VM E2E (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORKD_URL: http://127.0.0.1:8889
      FORKD_TAP: forkd-tap0
      FORKD_BIN: ${{ github.workspace }}/resx/forkd/forkd
      FORKD_KERNEL: ${{ github.workspace }}/resx/kernel/vmlinux-arcbox-0.0.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 第 0 步：fail fast —— 没有 /dev/kvm 就不要浪费构建时间。
      # GitHub 托管 runner 通常已带 /dev/kvm 且对 runner 用户可读写；
      # 若权限不符，补 kvm 组并放宽设备位后复检，仍失败则明确报错退出。
      - name: Verify /dev/kvm
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm 不存在：runner 不支持 KVM，真机 E2E 无法运行"
            exit 1
          fi
          if ! [ -w /dev/kvm ]; then
            echo "/dev/kvm 对当前用户不可写，尝试补 kvm 组并放宽设备权限"
            sudo groupadd -f kvm
            sudo usermod -aG kvm "$USER" || true
            sudo chmod 666 /dev/kvm
          fi
          if ! [ -w /dev/kvm ]; then
            echo "::error::/dev/kvm 仍不可读写（需 root:kvm 组权限）"
            exit 1
          fi
          ls -l /dev/kvm

      # 工具链：musl 目标（build-static 用）+ mke2fs/debugfs（e2fsprogs，
      # preflight 的 tool:mke2fs 检查与 build-rootfs 依赖）+ binutils
      # （readelf/objdump，preflight tool 检查）+ 网络/TAP 工具。
      - name: Install toolchain and system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools e2fsprogs binutils iproute2 iptables kmod
          rustup target add x86_64-unknown-linux-musl

      # resx 内置资产完整性：forkd/forkd-controller/firecracker/kernel/rootfs
      # 全量校验。随后按 runbook §0 的标准安装把 forkd 二进制放进 PATH
      # （controller 按自身 PATH 找 firecracker；`forkd exec` 验证步骤也依赖它）。
      - name: Verify resx checksums and install forkd binaries
        run: |
          set -euo pipefail
          sha256sum -c resx/SHA256SUMS
          # Windows 检出等场景可能丢失可执行位，统一恢复（controller 启动与
          # rfb-cli 委托 forkd 都要求可直接执行）。
          chmod +x resx/forkd/forkd resx/forkd/forkd-controller
          sudo install -m 755 resx/forkd/forkd /usr/local/bin/forkd
          sudo install -m 755 resx/forkd/forkd-controller /usr/local/bin/forkd-controller
          forkd --version | head -1

      # Firecracker：先校验并解包 resx 自带的 v1.16.1 官方压缩包（chmod +x）。
      # 实际投入使用的二进制是 resx/firecracker/firecracker-v1.12.1：
      # tests/forkd_real_e2e.rs 的 provenance 测试把 /usr/local/bin/firecracker
      # 的版本钉在 1.12.1，且 acceptance-evidence-2026-09-03.md 记录 v1.16.1
      # 会被版本门禁拒绝（快照与 Firecracker 版本绑定）。两者都先过 sha256。
      - name: Extract and install Firecracker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firecracker"
          (
            cd resx/firecracker
            sha256sum -c firecracker-v1.16.1-x86_64.tgz.sha256
          )
          tar -xzf resx/firecracker/firecracker-v1.16.1-x86_64.tgz \
            -C "$RUNNER_TEMP/firecracker"
          find "$RUNNER_TEMP/firecracker" -name 'firecracker-*-x86_64' -type f \
            -exec chmod +x {} +
          sudo install -m 755 resx/firecracker/firecracker-v1.12.1 \
            /usr/local/bin/firecracker
          firecracker --version

      # forkd guest 必须用带 virtio-net 的内核：resx 的 arcbox 没有虚拟网卡
      # 驱动，用它建的快照 guest 永不就绪（实测 ping 全丢、ARP INCOMPLETE）。
      # 下载官方 Firecracker CI 的 5.10.225 内核并覆盖 FORKD_KERNEL；ZBRT
      # （vsock-only）不受影响，仍可用 arcbox。
      - name: Download virtio-net guest kernel for forkd
        run: |
          set -euo pipefail
          curl -fsSL \
            https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.11/x86_64/vmlinux-5.10.225 \
            -o resx/kernel/vmlinux-5.10.225
          ls -la resx/kernel/vmlinux-5.10.225
          echo "FORKD_KERNEL=$PWD/resx/kernel/vmlinux-5.10.225" >> "$GITHUB_ENV"

      # 构建：CLI（含 rfb-cli bin）→ musl 静态 rfb-runtime → forkd-agent rootfs。
      # 与 sdk/BACKEND_SETUP.md 的文档流程一致。
      - name: Build rfb-cli and forkd-agent rootfs
        run: |
          set -euo pipefail
          cargo build -p rfb-sdk --features cli --release
          ./target/release/rfb-cli image build-static \
            --root . --target x86_64-unknown-linux-musl --package rfb-runtime
          ./target/release/rfb-cli image build-rootfs \
            target/x86_64-unknown-linux-musl/release/rfb-runtime \
            resx/rootfs/forkd-agent.ext4 --mode forkd-agent --force
          ./target/release/rfb-cli image check-kernel resx/kernel/vmlinux-arcbox-0.0.24

      # build.rfb 声明式脚本：一键构建带 python/lua 解释器、离线站点包、
      # 预编译 Rust 应用与附加文件的自定义镜像（examples/full/full.rfb 与
      # full/full-forkd.rfb），并用 debugfs 独立确认全部载荷进了镜像
      # （fail-closed 校验之外的第二重确认）。
      - name: Build custom images from build.rfb (interpreters + packages + rust app)
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR"
          # 示例 Rust 应用：musl 静态编译（脚本 [rust] apps 烤进 /usr/local/bin；
          # 产物文件 examples/full/hello 与 crate 源码目录 hello-app/ 分开命名，
          # 避免 cp 目标目录化）
          cargo build --release --target x86_64-unknown-linux-musl \
            --target-dir target \
            --manifest-path examples/full/hello-app/Cargo.toml
          cp target/x86_64-unknown-linux-musl/release/hello examples/full/hello
          ./target/release/rfb-cli image build-script --root . \
            examples/full/full.rfb 2>&1 | tee "$RUN_DIR/build-script.log"
          test -f examples/full/out/full-sandbox.ext4
          # 独立确认：解释器 applet、Rust 应用与附加文件都在镜像里
          debugfs -R "ls -l /bin" examples/full/out/full-sandbox.ext4 \
            | grep -E ' python3$| lua$'
          debugfs -R "cat /usr/local/bin/hello" \
            examples/full/out/full-sandbox.ext4 > /dev/null
          debugfs -R "cat /etc/motd" \
            examples/full/out/full-sandbox.ext4 \
            | grep -q "RFB demo image"
          # forkd 模式的同一套载荷（解释器 + 站点包 + Rust 应用 + 附加文件；
          # runtime 构建已缓存，秒级）
          ./target/release/rfb-cli image build-script --root . \
            examples/full/full-forkd.rfb 2>&1 | tee "$RUN_DIR/build-script-forkd.log"
          test -f examples/full/out/my-forkd.ext4

      # 临时 TAP：preflight 的 forkd_tap 检查要求 forkd-tap0 存在且 UP，
      # 地址段 10.42.0.1/24 与 real-machine-runbook.md 一致（全新 runner 无
      # cni0 冲突）。创建动作需要 root，结束后在 teardown 步骤删除。
      - name: Create forkd-tap0
        run: |
          set -euo pipefail
          sudo ip tuntap add dev forkd-tap0 mode tap
          sudo ip addr add 10.42.0.1/24 dev forkd-tap0
          sudo ip link set forkd-tap0 up
          ip -o link show forkd-tap0

      # forkd controller（官方二进制）：独立 state/audit/pid 目录，snapshot
      # root 指向默认快照目录（provenance 测试从 $HOME/.local/share/forkd/
      # snapshots/<tag> 读取 snapshot.json/memory.bin/vmstate）。
      # 注意：CLI 必须带 serve 子命令，且参数为 --state <json 文件> / --bind。
      - name: Start forkd-controller
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR/controller/state" "$HOME/.local/share/forkd/snapshots"
          resx/forkd/forkd-controller serve \
            --state "$RUN_DIR/controller/state/state.json" \
            --audit-log "$RUN_DIR/controller/audit.log" \
            --snapshot-root "$HOME/.local/share/forkd/snapshots" \
            --bind 127.0.0.1:8889 \
            > "$RUN_DIR/controller/stdout.log" 2>&1 &
          echo $! > "$RUN_DIR/controller/pid"
          for i in $(seq 1 60); do
            if curl -fsS "$FORKD_URL/v1/snapshots" > /dev/null 2>&1; then
              echo "controller ready (pid $(cat "$RUN_DIR/controller/pid"))"
              exit 0
            fi
            sleep 1
          done
          # 失败现场要能被公开 API 读到（日志下载需 token）：把 controller
          # stdout 与 audit 日志拆成 ::error:: 注解带出来。
          emit_diag() { bash scripts/ci-annotate.sh "$2" "$1" 3000; }
          emit_diag "$RUN_DIR/controller/stdout.log" ctrl-stdout
          emit_diag "$RUN_DIR/controller/audit.log" ctrl-audit
          echo "--- controller stdout ---"
          cat "$RUN_DIR/controller/stdout.log" || true
          echo "--- controller audit ---"
          cat "$RUN_DIR/controller/audit.log" || true
          exit 1

      # 创建本轮专属快照并等待 ready+bootable（就绪判定以 GET /v1/snapshots
      # 的 list 条目为准，与 preflight 的 forkd_snapshot 检查同源）。
      - name: Create snapshot and wait until ready
        run: |
          set -euo pipefail
          TAG="ci-e2e-$GITHUB_RUN_ID"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR"
          export FORKD_ROOTFS="$PWD/resx/rootfs/forkd-agent.ext4"
          ./target/release/rfb-cli forkd snapshot-create \
            --tag "$TAG" --tap forkd-tap0 --json \
            | tee "$RUN_DIR/snapshot-create.json"
          # 就绪判定脚本必须顶格落盘：python3 -c 内嵌代码会带上 YAML 块缩进，
          # IndentationError 会让每次轮询静默失败（快照早已就绪却永远等不到）。
          cat > /tmp/snap-ready.py <<'PY'
          import json, sys

          tag = sys.argv[1]
          snaps = json.load(sys.stdin)
          ok = any(s.get("tag") == tag
                   and str(s.get("status", "")).lower() == "ready"
                   and s.get("bootable") is True for s in snaps)
          sys.exit(0 if ok else 1)
          PY
          # daemon 异步收编快照（周期性扫描 snapshot-root，实测约 300s 才置
          # ready+bootable），等待窗给足 900s；就绪即提前退出。
          for i in $(seq 1 180); do
            if curl -fsS "$FORKD_URL/v1/snapshots" | python3 /tmp/snap-ready.py "$TAG"; then
              echo "snapshot $TAG ready+bootable"
              exit 0
            fi
            sleep 5
          done
          echo "::error::快照 $TAG 900s 内未进入 ready+bootable 状态"
          # 失败现场要能被公开 API 读到（日志下载需 token）：把快照列表、
          # snapshot-create 输出、快照目录与 audit 日志尾部拆成注解带出。
          emit_diag() { bash scripts/ci-annotate.sh "$2" "$1" 3000; }
          curl -sS "$FORKD_URL/v1/snapshots" > /tmp/snaps.json 2>&1 || true
          emit_diag /tmp/snaps.json snaps
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          [ -f "$RUN_DIR/snapshot-create.json" ] && \
            emit_diag "$RUN_DIR/snapshot-create.json" snap-create
          {
            echo "== snapshot root =="
            ls -la "$HOME/.local/share/forkd/snapshots/" 2>&1
            echo "== tag dir =="
            ls -la "$HOME/.local/share/forkd/snapshots/$TAG/" 2>&1
            echo "== snapshot.json =="
            cat "$HOME/.local/share/forkd/snapshots/$TAG/snapshot.json" 2>&1
            echo "== controller state.json =="
            cat "$RUN_DIR/controller/state/state.json" 2>&1
            echo "== audit tail =="
            tail -c 2000 "$RUN_DIR/controller/audit.log" 2>&1
            echo "== forkd proc =="
            ps aux | grep -E 'firecracker|forkd' | grep -v grep || true
          } > /tmp/vm-diag.txt 2>&1 || true
          emit_diag /tmp/vm-diag.txt vm-diag
          exit 1

      # 跑真机 E2E：三重门（unix+cli cfg、#[ignore]、RFB_REAL_E2E=1）。
      # RFB_E2E_SNAPSHOT_TAG / RFB_E2E_ROOTFS_DIR 是 tests/common/mod.rs 要求
      # 的 harness 环境变量；FORKD_* 是 rfb-cli 与 preflight 检查所需。
      # 注意：--test-threads=1 是真机 E2E 的明确例外 —— 真实 VM/快照无法安全
      # 并行（多个测试会同时 boot/删除同一个快照栈）；仓库“默认并行”的规则
      # 针对单元测试，这里必须串行，与 run-real.sh 保持一致。
      - name: Run real-VM E2E tests
        run: |
          set -euo pipefail
          # 不依赖 GITHUB_ENV 传递（实测未传播导致 $TAG unbound 秒退）：
          # TAG 与 step 10 同源，按 run id 确定性重算。
          TAG="ci-e2e-$GITHUB_RUN_ID"
          export RFB_REAL_E2E=1
          export RFB_E2E_SNAPSHOT_TAG="$TAG"
          export RFB_E2E_ROOTFS_DIR="$PWD/resx/rootfs"
          export FORKD_SNAPSHOT_TAG="$TAG"
          export FORKD_ROOTFS="$PWD/resx/rootfs/forkd-agent.ext4"
          # 失败现场要能被公开 API 读到（日志下载需 token）：把 FAILED 测试、
          # panic 与日志尾部拆成 ::error:: 注解带出。
          emit_diag() { bash scripts/ci-annotate.sh "$2" "$1" 3000; }
          log=/tmp/real-e2e.log
          set +e
          cargo test -p rfb-sdk --features cli --test forkd_real_e2e \
            -- --ignored --test-threads=1 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "real-VM E2E tests passed"
            exit 0
          fi
          {
            echo "== FAILED tests =="
            grep -E "^test .* FAILED|test result:" "$log" || true
            echo "== panics =="
            grep -B2 -A8 "panicked at" "$log" | head -120 || true
            echo "== tail =="
            tail -c 2500 "$log"
          } > /tmp/e2e-diag.txt 2>&1
          echo "::error::real-VM E2E 失败 rc=$rc（详情见注解）"
          emit_diag /tmp/e2e-diag.txt e2e-tests
          exit "$rc"

      # 自定义镜像真机验证（zeroboot）：boot build.rfb 出的 examples/full
      # 镜像，guest 里跑 python3/lua（含站点包导入）、Rust 应用与超时击杀 ——
      # 复用既有的 zeroboot_interpreters 真机测试（fixture 目录指到
      # build-script 产物）。
      - name: Real-VM verify custom image (zeroboot interpreters + rust app)
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR/interp-image"
          cp examples/full/out/full-sandbox.ext4 "$RUN_DIR/interp-image/rootfs.ext4"
          emit_diag() { bash scripts/ci-annotate.sh "$2" "$1" 3000; }
          log=/tmp/zb-interp.log
          set +e
          RFB_REAL_E2E=1 \
          RFB_E2E_ROOTFS_DIR="$RUN_DIR/interp-image" \
          RFB_E2E_FIRECRACKER=/usr/local/bin/firecracker \
            cargo test -p rfb-sdk --features cli --test zeroboot_interpreters \
            -- --ignored --test-threads=1 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::自定义镜像真机验证失败 rc=$rc"
            emit_diag "$log" zb-interp
            exit "$rc"
          fi

      # 自定义镜像真机验证（forkd）：full-forkd 镜像建快照 → acceptance 全
      # 门禁（含负向用例）→ forkd exec 跑烤进镜像的 Rust 应用与 python/lua。
      # 就绪判定脚本顶格先行落盘，不依赖其它步骤的写入顺序。
      - name: Real-VM verify custom image (forkd snapshot + acceptance + exec)
        run: |
          set -euo pipefail
          TAG2="ci-e2e-script-$GITHUB_RUN_ID"
          echo "TAG2=$TAG2" >> "$GITHUB_ENV"
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          cat > /tmp/snap-ready.py <<'PY'
          import json, sys
          tag = sys.argv[1]
          snaps = json.load(sys.stdin)
          ok = any(s.get("tag") == tag
                   and str(s.get("status", "")).lower() == "ready"
                   and s.get("bootable") is True for s in snaps)
          sys.exit(0 if ok else 1)
          PY
          FORKD_ROOTFS="$PWD/examples/full/out/my-forkd.ext4" \
            ./target/release/rfb-cli forkd snapshot-create \
            --tag "$TAG2" --tap forkd-tap0 --kernel "$FORKD_KERNEL" \
            --json | tee "$RUN_DIR/snapshot-create-script.json"
          for i in $(seq 1 180); do
            if curl -fsS "$FORKD_URL/v1/snapshots" \
                 | python3 /tmp/snap-ready.py "$TAG2"; then
              echo "snapshot $TAG2 ready+bootable"
              break
            fi
            [ "$i" = 180 ] && { echo "::error::快照 $TAG2 900s 未就绪"; exit 1; }
            sleep 5
          done
          FORKD_SNAPSHOT_TAG="$TAG2" FORKD_ROOTFS="$PWD/examples/full/out/my-forkd.ext4" \
            ./target/release/rfb-cli forkd acceptance --tag "$TAG2" --require-vm \
            --json | tee "$RUN_DIR/acceptance-script.json"
          SID=$(./target/release/rfb-cli forkd sandbox-create --tag "$TAG2" --json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          ADDR=$(curl -s "$FORKD_URL/v1/sandboxes" | python3 -c "
          import json,sys
          print(next(s['guest_addr'] for s in json.load(sys.stdin) if s['id']=='$SID'))")
          forkd exec --target "$ADDR" -- /usr/local/bin/hello ci-e2e \
            | grep -q "rust-in-image"
          forkd exec --target "$ADDR" -- python3 -c "import demo; print(demo.VALUE)" \
            | grep -q "^42$"
          forkd exec --target "$ADDR" -- lua -e "print(require('demo').answer())" \
            | grep -q "^42$"
          ./target/release/rfb-cli forkd sandbox-destroy "$SID" --json > /dev/null

      # 沙箱全面基准（真实快照）：create/ping/stream/exec/cleanup 分位数 +
      # 多沙箱 workload 聚合。JSON 同时进 run 日志与 logs 目录，随
      # forkd-e2e-logs artifact 归档，便于跨 run 对比性能回归。
      - name: Sandbox benchmark (forkd micro + workload, JSON archive)
        run: |
          set -euo pipefail
          TAG="ci-e2e-$GITHUB_RUN_ID"
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR"
          export FORKD_SNAPSHOT_TAG="$TAG"
          export FORKD_ROOTFS="$PWD/resx/rootfs/forkd-agent.ext4"
          ./target/release/rfb-cli forkd benchmark --tag "$TAG" --n 20 --json \
            | tee "$RUN_DIR/bench-forkd.json"
          ./target/release/rfb-cli forkd workload --tag "$TAG" \
            --sandboxes 3 --rounds 2 --reuse-execs 25 --json \
            | tee "$RUN_DIR/bench-workload.json"

      # 沙箱启动吞吐 + 资源占用：共享 tap 模式下一次只允许一个存活沙箱
      # （并发 create 会被 controller 以 503 拒绝；per_child_netns 需要 root
      # 预置的 netns 池，且 netns 内的 guest 只能由 controller 进 netns 代理
      # 访问），故这里测该部署模式下真实的「每秒启动数」：create→destroy
      # 顺序循环；并行能力仅记录为 unsupported。同时在循环前/后/稳定期/
      # 销毁后采样 forkd-controller 与全部 firecracker 进程的 RSS、CPU
      # ticks、FD 数，结果写入 bench-resources.jsonl 随 artifact 归档。
      - name: Sandbox start-rate benchmark (sequential cycles + memory/CPU sampling)
        run: |
          set -euo pipefail
          TAG="ci-e2e-$GITHUB_RUN_ID"
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR"
          export FORKD_SNAPSHOT_TAG="$TAG"
          export FORKD_ROOTFS="$PWD/resx/rootfs/forkd-agent.ext4"
          OUT="$RUN_DIR/bench-resources.jsonl"

          # 采样：controller + firecracker 的 RSS(MiB)、CPU ticks、FD 合计。
          # /proc/<pid>/stat 的 comm 含空格/括号，故在最后一个 ')' 之后按
          # 空白切分：位置 12/13 对应 utime/stime（字段 14/15）。
          # 注意：不能用 bash 的 $12 —— 那是 ${1} 后跟字面量 '2'（set -u 下
          # 曾报 "S2: unbound variable"）。
          proc_stats() {
            local pid="$1" rss fds ticks
            rss=$(awk '/VmRSS/{print $2}' "/proc/$pid/status" 2>/dev/null || echo 0)
            [ -n "$rss" ] || rss=0
            fds=$(ls "/proc/$pid/fd" 2>/dev/null | wc -l)
            ticks=$(awk -F')' \
              '{ s = $NF; sub(/^[[:space:]]+/, "", s); split(s, f, /[[:space:]]+/); print f[12] + f[13] }' \
              "/proc/$pid/stat" 2>/dev/null || echo 0)
            [ -n "$ticks" ] || ticks=0
            printf '%s %s %s\n' "$rss" "$fds" "$ticks"
          }

          sample() {
            local label="$1" ctl_rss=0 fc_rss=0 fc_count=0 fds=0 ticks=0 p rss f t
            for p in $(pgrep -f forkd-controller || true); do
              read -r rss f t <<< "$(proc_stats "$p")"
              ctl_rss=$((ctl_rss + rss))
              fds=$((fds + f))
              ticks=$((ticks + t))
            done
            for p in $(pgrep -x firecracker || true); do
              read -r rss f t <<< "$(proc_stats "$p")"
              fc_count=$((fc_count + 1))
              fc_rss=$((fc_rss + rss))
              fds=$((fds + f))
              ticks=$((ticks + t))
            done
            printf '{"label":"%s","controller_rss_mb":%s,"firecracker_count":%s,"firecracker_rss_mb":%s,"cpu_ticks":%s,"fds":%s}\n' \
              "$label" "$((ctl_rss / 1024))" "$fc_count" "$((fc_rss / 1024))" "$ticks" "$fds" \
              | tee -a "$OUT"
          }

          # 宿主容量必须进 artifact：没有核数就无法区分「guest 不扩展」与
          # 「runner 核不够」（两档 vCPU 会与 Firecracker 线程抢同一批核）。
          echo "{\"label\":\"host\",\"nproc\":$(nproc),\"model\":\"$(awk -F: '/model name/{print $2; exit}' /proc/cpuinfo | sed 's/^ *//')\"}" | tee -a "$OUT"

          N=6
          sample idle
          start=$(date +%s.%N)
          created=0
          for i in $(seq 1 "$N"); do
            ok=0
            for attempt in 1 2 3; do
              if ./target/release/rfb-cli forkd sandbox-create --tag "$TAG" --json \
                   > "$RUN_DIR/seq-$i.json" 2>&1; then
                ok=1
                break
              fi
              sleep 1
            done
            [ "$ok" = 1 ] || continue
            created=$((created + 1))
            sid=$(python3 -c '
          import json, sys
          data = json.load(open(sys.argv[1]))
          if isinstance(data, list) and data:
              data = data[0]
          print(data.get("id", "") if isinstance(data, dict) else "")
          ' "$RUN_DIR/seq-$i.json" 2>/dev/null || true)
            [ -n "$sid" ] || continue
            # destroy 会向 controller 确认列表里已无该 id 才返回，因此返回即
            # 表示共享 tap 已释放，下一次 create 可以安全发起。
            ./target/release/rfb-cli forkd sandbox-destroy "$sid" --json > /dev/null 2>&1 || true
          done
          end=$(date +%s.%N)
          python3 -c '
          import sys
          n, created, start, end = int(sys.argv[1]), int(sys.argv[2]), float(sys.argv[3]), float(sys.argv[4])
          wall = max(end - start, 0.001)
          print("{\"label\":\"sequential\",\"n_requested\":%d,\"n_created\":%d,\"wall_s\":%.3f,\"starts_per_sec\":%.2f}"
                % (n, created, wall, created / wall))
          ' "$N" "$created" "$start" "$end" | tee -a "$OUT"
          echo '{"label":"parallel","status":"unsupported","reason":"shared tap admits one live sandbox; per_child_netns needs a root-provisioned netns pool (sudo scripts/netns-setup.sh N) and controller-mediated guest access"}' \
            | tee -a "$OUT"
          sample after-burst
          sleep 3
          sample steady
          for f in "$RUN_DIR"/seq-*.json; do
            sid=$(python3 -c '
          import json, sys
          data = json.load(open(sys.argv[1]))
          if isinstance(data, list) and data:
              data = data[0]
          print(data.get("id", "") if isinstance(data, dict) else "")
          ' "$f" 2>/dev/null || true)
            [ -n "$sid" ] || continue
            ./target/release/rfb-cli forkd sandbox-destroy "$sid" --json > /dev/null || true
          done
          sample after-destroy

      # ZeroBoot/ZBRT 基准（与 forkd 并列的第二后端）：先构建 zeroboot-zbrt
      # rootfs，再跑 full-protocol acceptance + 100 样本往返 bench，最后跑
      # 容量基准（冷启动、并发阶梯 1/2/4/8/16、按内存档采样 Firecracker RSS）。
      - name: ZeroBoot benchmark (acceptance + round trips + capacity ladder + RSS)
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          mkdir -p "$RUN_DIR"
          KERNEL="$PWD/resx/kernel/vmlinux-arcbox-0.0.24"
          ZB_ROOTFS="$PWD/resx/rootfs/zeroboot-zbrt.ext4"
          FC=/usr/local/bin/firecracker

          ./target/release/rfb-cli image build-rootfs \
            target/x86_64-unknown-linux-musl/release/rfb-runtime \
            "$ZB_ROOTFS" --mode zeroboot-zbrt --force

          ./target/release/rfb-cli zeroboot verify --bench --require-vm \
            --kernel "$KERNEL" --rootfs "$ZB_ROOTFS" --firecracker "$FC" --json \
            | tee "$RUN_DIR/bench-zeroboot-verify.json"

          # 阶梯同时扫 vCPU：会话池让并发命令真正并行，vCPU 才是吞吐的
          # 上限轴；两档（1/2 vCPU）足以看出是否随核数扩展。
          cargo build -p rfb-ben --release
          ./target/release/rfb-ben zbrt \
            --kernel "$KERNEL" --rootfs "$ZB_ROOTFS" --firecracker "$FC" \
            --samples 100 --warmup 5 --levels 1,2,4,8,16 --rounds 4 \
            --mem-mib 512 --vcpus 1,2 \
            --json-out "$RUN_DIR/bench-zeroboot.json" | tee "$RUN_DIR/bench-zeroboot.log"

          # Provider/SDK 真机验收（此前从未被任何驱动执行过的 #[ignore] 套件）：
          # RFB_E2E_ZBRT_ROOTFS 指向 CI 构建出的 rootfs；fixture 目录里同时
          # 放一份 zeroboot_real_e2e 期望的别名文件。
          mkdir -p "$RUN_DIR/zb-rootfs"
          cp "$ZB_ROOTFS" "$RUN_DIR/zb-rootfs/zeroboot-zbrt-e2e.ext4"
          RFB_REAL_E2E=1 \
          RFB_E2E_ZBRT_ROOTFS="$ZB_ROOTFS" \
          RFB_E2E_FIRECRACKER="$FC" \
            cargo test -p rfb-sdk --features cli --test zeroboot_provider_real \
            -- --ignored --test-threads=1 2>&1 | tee "$RUN_DIR/zb-provider-real.log"
          RFB_REAL_E2E=1 \
          RFB_E2E_ROOTFS_DIR="$RUN_DIR/zb-rootfs" \
          RFB_E2E_FIRECRACKER="$FC" \
            cargo test -p rfb-sdk --features cli --test zeroboot_real_e2e \
            -- --ignored --test-threads=1 2>&1 | tee "$RUN_DIR/zb-real-e2e.log"

      # 100 并发热启动并发门（快照分片）：4 分片 + 64MiB/VM + 100 并发
      # create（每分片摊薄 ~50ms/create）+ 100 并发 echo。内存账：100×64MiB
      # + 4 父快照 CoW ≈ 7GB，16GB runner 可容纳。RFB_E2E_KERNEL 指向
      # virtio-net 内核（热恢复对 arcbox 内核会 vsock panic）。
      - name: Real-VM 100-concurrency gate (zeroboot snapshot shards)
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          RUN="$PWD/examples/full/out/full-sandbox.ext4"
          emit_diag() { bash scripts/ci-annotate.sh "$2" "$1" 3000; }
          log="$RUN_DIR/zb-concurrency.log"
          set +e
          RFB_REAL_E2E=1 \
          RFB_E2E_KERNEL="$PWD/resx/kernel/vmlinux-5.10.225" \
          RFB_E2E_FIRECRACKER="$FC" \
          RFB_E2E_CONCURRENCY=100 \
          RFB_ZBRT_SNAPSHOT_DIR=/dev/shm/rfb-zbrt-snap \
          RFB_ZBRT_SNAPSHOT_SHARDS=4 \
          RFB_ZBRT_VM_MEM_MIB=64 \
            cargo test -p rfb-sdk --features cli --release \
            --test zeroboot_concurrency -- --ignored --nocapture 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::100 并发真机门失败 rc=$rc"
            emit_diag "$log" zb-concurrency
            exit "$rc"
          fi
          grep -q "100/100 execs ok" "$log"

      # 真机 fork 门（zeroboot 快照分叉）：checkpoint 活动 VM → 恢复两个子
      # VM（原沙箱延续 + fork），验证 workspace tmpfs 状态继承、两代沙箱
      # 都可用、链式 fork（fork 的 fork）、checkpoint 目录随最后沙箱回收。
      - name: Real-VM fork gate (zeroboot live checkpoint)
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          emit_diag() { bash scripts/ci-annotate.sh "$2" "$1" 3000; }
          log="$RUN_DIR/zb-fork.log"
          set +e
          RFB_REAL_E2E=1 \
          RFB_E2E_KERNEL="$PWD/resx/kernel/vmlinux-5.10.225" \
          RFB_E2E_FIRECRACKER="$FC" \
          RFB_E2E_ZBRT_ROOTFS="$PWD/examples/full/out/full-sandbox.ext4" \
          RFB_ZBRT_SNAPSHOT_DIR=/dev/shm/rfb-zbrt-snap \
          RFB_ZBRT_VM_MEM_MIB=64 \
            cargo test -p rfb-sdk --features cli --release \
            --test zeroboot_fork -- --ignored --nocapture 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! grep -q "FORK_REAL_OK" "$log"; then
            echo "::error::真机 fork 门失败 rc=$rc"
            emit_diag "$log" zb-fork
            exit "${rc:-1}"
          fi

      # 清理必须无条件执行：删快照、停 controller、删 TAP、清临时目录。
      # 日志先归档到 logs 目录供下一步上传；本轮不设任何 token/key（无
      # FORKD_TOKEN），日志天然脱敏 —— 若未来引入认证，必须先过滤再上传。
      - name: Teardown
        if: always()
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/forkd-e2e"
          TAG="${TAG:-ci-e2e-$GITHUB_RUN_ID}"
          if [ -n "$TAG" ] && [ -x target/release/rfb-cli ]; then
            FORKD_ROOTFS="$PWD/resx/rootfs/forkd-agent.ext4" \
              ./target/release/rfb-cli forkd snapshot-delete \
              --tag "$TAG" --force --json || \
              echo "warning: snapshot-delete $TAG 失败（可能未创建）"
          fi
          # build-script 自定义镜像的第二快照（custom-image verify 步骤创建）。
          if [ -n "${TAG2:-}" ] && [ -x target/release/rfb-cli ]; then
            FORKD_ROOTFS="$PWD/examples/full/out/my-forkd.ext4" \
              ./target/release/rfb-cli forkd snapshot-delete \
              --tag "$TAG2" --force --json || \
              echo "warning: snapshot-delete $TAG2 失败（可能未创建）"
          fi
          if [ -f "$RUN_DIR/controller/pid" ]; then
            kill "$(cat "$RUN_DIR/controller/pid")" 2>/dev/null || true
          fi
          pkill -f forkd-controller 2>/dev/null || true
          sudo ip link set forkd-tap0 down 2>/dev/null || true
          sudo ip tuntap del dev forkd-tap0 mode tap 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/forkd-e2e-logs"
          if [ -d "$RUN_DIR" ]; then
            mv "$RUN_DIR"/* "$RUNNER_TEMP/forkd-e2e-logs"/ 2>/dev/null || true
          fi
          rm -rf "$RUN_DIR"

      - name: Upload sanitized logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forkd-e2e-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/forkd-e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
