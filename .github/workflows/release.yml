# RFB 发布流水线：tag v*.*.* 触发，四条独立渠道并行发布。
#
# 渠道与凭据（secrets 名以仓库配置为准）：
# - crates.io:  rfb-runtime → rfb-sdk → rfb-rig（主 crate 发布名 rfb-sdk——
#   crates.io 裸名 `rfb` 被无关项目占用，lib 名仍是 rfb；scripts/release.sh
#   按依赖链发布并等待索引传播）。凭据 CRATES_KEY ->
#   CARGO_REGISTRIES_CRATES_IO_TOKEN。
# - PyPI:       sdk/python 打包为 rfb-sdk（PyPI `rfb` 名称同样被占用）。
#   凭据 PYPI_KEY（PyPI API token）。
# - Maven:      io.github.cricle:rfb-sdk -> Maven Central（central-publishing-maven-plugin，
#   profile central-release）。凭据 MAVEN_KEY：settings.xml 的 <server> 块
#   （id 必须为 central）；签名需 GPG_PRIVATE_KEY + GPG_PASSPHRASE
#   （Central 强制要求 GPG 签名）。
# - NuGet:      Rfb.Sdk -> nuget.org。凭据 NUGET_KEY（API key），
#   包版本由 tag 推导（v0.0.1 -> 0.0.1）。
# - npm:        sdk/nodejs 打包为 rfb-sdk（TypeScript，构建+测试后发布）；
#   rfb-cli 为仅二进制包（linux-x64，bin 入口直接指向二进制）。凭据
#   NPM_KEY（npm granular access token：Read and write + All packages + bypass 2FA）。
#
# tag 与 workspace 版本的一致性（v0.0.1 <-> Cargo.toml version 0.0.1）在
# crates 渠道强制校验；PyPI/Maven 版本各自固定为 0.0.1，与 tag 同步维护。

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# 同一 tag 的重跑串行化：TOCTOU 存在性检查/上传不允许并发交错，否则
# 一次成功一次失败（docs/RELEASE.md 承诺的重跑安全依赖串行）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates:
    name: Publish rfb-runtime / rfb-sdk / rfb-rig to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the crates job creates the GitHub Release.
    permissions:
      contents: write
    steps:
      # fetch-depth 0：release.sh 用 git describe --tags --exact-match 校验
      # tag 与 workspace 版本一致，浅克隆拿不到 tag 会导致发布误判失败。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Validate tag matches workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 三个已发布的 crate 都必须与 tag 一致：只对 rfb-sdk 校验会让
          # "部分 bump" 通过门禁，而 release.sh 会跳过 crates.io 上已存在的
          # 版本，导致新 tag 悄悄发布旧版本依赖。
          for name in rfb-runtime rfb-sdk rfb-rig; do
            VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(x['version'] for x in json.load(sys.stdin)['packages'] if x['name'] == '$name'))")
            test "$TAG" = "v$VERSION" || { echo "tag $TAG != v$VERSION for $name" >&2; exit 1; }
          done
      - name: Publish (gates + package + three crates in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_KEY }}
          CRATES_IO_PROPAGATION_SECONDS: '60'
        run: |
          set -uo pipefail
          # 失败现场要能被公开 API 读到（日志下载需 token）：日志尾部拆成注解。
          log=/tmp/release-crates.log
          set +e
          bash scripts/release.sh 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::release.sh 失败 rc=$rc（尾部见注解）"
            bash scripts/ci-annotate.sh release-crates "$log" 3000
            exit "$rc"
          fi
      - name: Build CLI
        run: cargo build -p rfb-sdk --features cli --release
      - name: Package and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/rfb-cli dist/rfb-cli
          cp dist/rfb-cli dist/rfb-cli-linux-x64
          (cd dist && sha256sum rfb-cli > SHA256SUMS)
          tar -C dist -czf "dist/rfb-${TAG}.tar.gz" rfb-cli SHA256SUMS
          sha256sum "dist/rfb-${TAG}.tar.gz" >> dist/SHA256SUMS
          sha256sum "dist/rfb-cli-linux-x64" >> dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: |
            dist/rfb-${{ github.ref_name }}.tar.gz
            dist/rfb-cli-linux-x64
            dist/SHA256SUMS
          generate_release_notes: true
      # CLI 二进制供 npm / nuget job 打包（rfb-cli / Rfb.Cli；两者都是
      # 仅清单 + 二进制的包，不含任何包装代码）。
      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rfb-cli-linux-x64
          path: dist/rfb-cli
          if-no-files-found: error
          retention-days: 1

  pypi:
    name: Publish rfb-sdk to PyPI
    needs: crates
    runs-on: ubuntu-latest
    # OIDC trusted publishing：首次发布前需在
    # https://pypi.org/manage/project/rfb-sdk/settings/ 启用
    # "Trusted Publishing"（信任本仓库的当前名字和工作流）；配置完成后可撤回
    # PYPI_KEY secret。配置前发布会因 OIDC 凭据无效而失败。
    permissions:
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          set -uo pipefail
          log=/tmp/release-pypi-build.log
          set +e
          {
            python -m pip install --upgrade build
            python -m build sdk/python
          } 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::python -m build 失败 rc=$rc（尾部见注解）"
            bash scripts/ci-annotate.sh release-pypi "$log" 3000
            exit "$rc"
          fi
      # 重跑保护：PyPI 上该版本已存在时跳过发布（重复版本发布会报错失败）。
      - name: Skip publish if version already on PyPI (rfb-sdk)
        id: pypi_guard
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/rfb-sdk/${VERSION}/json" || true)
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "rfb-sdk ${VERSION} 已在 PyPI 上，跳过重复发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing（OIDC）：不传 `password` 且 job 具有 id-token: write
      # 时，action 自动走 OIDC 交换（无需长期 PYPI_KEY）；attestations 默认开启
      # （PEP 740）。该 action 没有 trusted-publishing 输入。
      - name: Publish rfb-sdk to PyPI
        if: steps.pypi_guard.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist

  maven:
    name: Publish rfb-sdk to Maven Central
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Configure settings.xml from MAVEN_KEY
        env:
          MAVEN_KEY: ${{ secrets.MAVEN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_KEY:-}" ]; then
            echo "::error::secret MAVEN_KEY 未配置（Maven Central 的 <server> 凭据块，<id> 必须为 central）"
            exit 1
          fi
          mkdir -p "$HOME/.m2"
          # 兼容两种形态：整份 settings.xml 原样落盘；裸 <server> 块则包一层
          if printf '%s' "$MAVEN_KEY" | grep -q '<settings'; then
            printf '%s\n' "$MAVEN_KEY" > "$HOME/.m2/settings.xml"
          else
            {
              printf '<?xml version="1.0" encoding="UTF-8"?>\n'
              printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">\n'
              printf '  <servers>\n'
              printf '%s\n' "$MAVEN_KEY"
              printf '  </servers>\n'
              printf '</settings>\n'
            } > "$HOME/.m2/settings.xml"
          fi
          # 容错归一：central-publishing-maven-plugin 硬编码要求 server id 为
          # central（"server is null" 皆因 id 不符）。把第一个 server 的 id
          # 强制改写为 central，用户 secret 里写错 id 也不再卡发布。
          # heredoc 内容保持与块缩进一致（YAML 剥离后顶格），否则整个
          # workflow 文件解析失败、Release run 变成 0 个 job。
          python3 - "$HOME/.m2/settings.xml" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s2, n = re.subn(r"(<server>\s*<id>)[^<]*(</id>)", r"\1central\2", s, count=1)
          if n == 0:
              s2 = s.replace("<servers>", "<servers>\n    <server><id>central</id></server>", 1)
          p.write_text(s2, encoding="utf-8")
          PY
          # 诊断（不含密码）：列出归一后的 server id。
          echo "settings.xml server ids (after normalize):"
          grep -o '<id>[^<]*</id>' "$HOME/.m2/settings.xml" || echo "(none found)"
      - name: Check GPG key secret
        run: |
          set -euo pipefail
          if [ "$HAS_GPG_KEY" != "true" ]; then
            echo "::error::secret GPG_PRIVATE_KEY 未配置：Maven Central 强制要求 GPG 签名"
            exit 1
          fi
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/gpg-private-key.asc"
          printf '%s' "$GPG_PRIVATE_KEY" > "$KEY_FILE"
          gpg --batch --import "$KEY_FILE"
          rm -f "$KEY_FILE"
      # 重跑保护：该版本已在 Maven Central 时跳过部署。
      - name: Skip if version already on Maven Central
        id: maven_guard
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://repo1.maven.org/maven2/io/github/cricle/rfb-sdk/${VERSION}/rfb-sdk-${VERSION}.pom" || true)
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "io.github.cricle:rfb-sdk ${VERSION} 已在 Maven Central 上，跳过重复部署"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify pom version matches the tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pom_version=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('sdk/java/pom.xml').getroot(); print(root.find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")
          if [ "$pom_version" != "$VERSION" ]; then
            echo "::error::sdk/java/pom.xml 版本 $pom_version != tag $VERSION：先同步 pom 版本再重试（Central 不接受重发同版本）"
            exit 1
          fi
      - name: Publish to Maven Central
        # Namespace 需在 Central portal 完成一次性验证（一次性的 portal 操作，GitHub 账号即可验证）；验证前发布
        # 必须真实失败（不掩盖），验证通过后自动恢复。
        if: steps.maven_guard.outputs.exists != 'true'
        env:
          # maven-gpg-plugin 3.2+ 读取该环境变量；不要把口令放进 argv
          # （/proc/<pid>/cmdline 对所有本机进程可见）。
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -uo pipefail
          log=/tmp/release-maven.log
          set +e
          mvn --batch-mode --no-transfer-progress -Pcentral-release deploy \
            -f sdk/java/pom.xml 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::mvn deploy 失败 rc=$rc（ERROR 行与尾部见注解）"
            {
              echo "== ERROR lines =="
              grep -E "\[ERROR\]" "$log" | head -30 || true
              echo "== tail =="
              tail -c 2000 "$log"
            } > /tmp/maven-diag.txt 2>&1
            bash scripts/ci-annotate.sh release-maven /tmp/maven-diag.txt 0
            exit "$rc"
          fi

  nuget:
    name: Publish Rfb.Sdk + Rfb.Cli to NuGet
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      # 重跑保护：已上架的包跳过 pack/push。
      - name: Check already-published packages
        id: nuget_guard
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # -L：flatcontainer 对部分网络出口返回 302 重定向，不带 -L 会把
          # 已发布误判为未发布（重复 push 依赖 --skip-duplicate 兜底）。
          sdk_code=$(curl -sL -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/rfb.sdk/${VERSION}/rfb.sdk.${VERSION}.nupkg" || true)
          cli_code=$(curl -sL -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/rfb.cli/${VERSION}/rfb.cli.${VERSION}.nupkg" || true)
          echo "sdk_missing=$([ "$sdk_code" != "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cli_missing=$([ "$cli_code" != "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Download CLI binary
        if: steps.nuget_guard.outputs.cli_missing == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rfb-cli-linux-x64
          path: rfb-cli-bin
      - name: Pack
        if: steps.nuget_guard.outputs.sdk_missing == 'true' || steps.nuget_guard.outputs.cli_missing == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.nuget_guard.outputs.sdk_missing }}" = "true" ]; then
            dotnet pack sdk/csharp/src/Rfb.Sdk/Rfb.Sdk.csproj -c Release \
              -o dist/nuget -p:Version="$VERSION"
          else
            echo "Rfb.Sdk ${VERSION} 已上架，跳过 pack"
          fi
          if [ "${{ steps.nuget_guard.outputs.cli_missing }}" = "true" ]; then
            mkdir -p sdk/csharp/Rfb.Cli/tools
            cp rfb-cli-bin/rfb-cli sdk/csharp/Rfb.Cli/tools/rfb-cli
            chmod +x sdk/csharp/Rfb.Cli/tools/rfb-cli
            dotnet pack sdk/csharp/Rfb.Cli/Rfb.Cli.csproj -c Release \
              -o dist/nuget -p:Version="$VERSION"
          else
            echo "Rfb.Cli ${VERSION} 已上架，跳过 pack"
          fi
      - name: Push to nuget.org
        if: steps.nuget_guard.outputs.sdk_missing == 'true' || steps.nuget_guard.outputs.cli_missing == 'true'
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${NUGET_KEY:-}" ]; then
            echo "::error::secret NUGET_KEY 未配置（nuget.org API key）"
            exit 1
          fi
          log=/tmp/release-nuget.log
          set +e
          dotnet nuget push "dist/nuget/*.nupkg" --api-key "$NUGET_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::dotnet nuget push 失败 rc=$rc（尾部见注解）"
            bash scripts/ci-annotate.sh release-nuget "$log" 2000
            exit "$rc"
          fi

  npm:
    name: Publish rfb-sdk + rfb-cli to npm
    needs: crates
    runs-on: ubuntu-latest
    # --provenance 需要 id-token write 权限（生成 npm 的 Sigstore 签名）。
    permissions:
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      # 重跑保护：该版本已在 npm 上时跳过发布（npm 对重复版本直接报错）。
      - name: Check already-published packages
        id: npm_guard
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sdk_code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/rfb-sdk/${VERSION}" || true)
          cli_code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/rfb-cli/${VERSION}" || true)
          echo "sdk_missing=$([ "$sdk_code" != "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cli_missing=$([ "$cli_code" != "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # rfb-sdk：TypeScript SDK。prepublishOnly 会在 publish 时重建 dist
      # （npm run build）；测试必须在这里显式执行，否则不会挡在 publish 之前。
      - name: Publish rfb-sdk
        if: steps.npm_guard.outputs.sdk_missing == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          set -uo pipefail
          log=/tmp/release-npm-sdk.log
          set +e
          {
            cd sdk/nodejs
            npm ci --no-audit --no-fund
            npm test
            npm publish --provenance
          } 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::npm publish rfb-sdk 失败 rc=$rc（尾部见注解）"
            bash scripts/ci-annotate.sh release-npm-sdk "$log" 2000
            exit "$rc"
          fi

      # rfb-cli：仅二进制的 npm 包（linux-x64 原生二进制 + bin 入口，无 JS 包装）。
      - name: Download CLI binary
        if: steps.npm_guard.outputs.cli_missing == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rfb-cli-linux-x64
          path: dist-cli/raw
      - name: Publish rfb-cli
        if: steps.npm_guard.outputs.cli_missing == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist/npm-cli
          mkdir -p dist/npm-cli
          cp dist-cli/raw/rfb-cli dist/npm-cli/rfb-cli
          chmod +x dist/npm-cli/rfb-cli
          # 显式校验：缺失二进制时绝不能发布一个空壳包（cp 失败不会中断本脚本）。
          test -x dist/npm-cli/rfb-cli || {
            echo "::error::rfb-cli 二进制缺失（dist-cli/raw/rfb-cli），拒绝发布空壳包"
            exit 1
          }
          cat > dist/npm-cli/package.json <<EOF
          {
            "name": "rfb-cli",
            "version": "$VERSION",
            "description": "RFB CLI (rfb-cli) - prebuilt native binary for linux-x64",
            "bin": { "rfb-cli": "rfb-cli" },
            "files": ["rfb-cli", "README.md"],
            "os": ["linux"],
            "cpu": ["x64"],
            "engines": { "node": ">=18" },
            "license": "MIT OR Apache-2.0",
            "author": "Cricle <qnydhuaji@gmail.com>",
            "repository": { "type": "git", "url": "https://github.com/Cricle/rfb" }
          }
          EOF
          cat > dist/npm-cli/README.md <<'MDEOF'
          # rfb-cli

          Prebuilt native binary distribution of the RFB CLI for linux-x64.
          Installed via npm (`npm install -g rfb-cli` or `npx rfb-cli`); the
          `rfb-cli` bin entry executes the bundled native executable directly.

          See <https://github.com/Cricle/rfb> for the full project, source
          releases, and usage documentation.
          MDEOF
          log=/tmp/release-npm-cli.log
          set +e
          # `./` 前缀强制目录语义：不带它 npm 会把 dist/npm-cli 当 GitHub 简写
          # （owner/repo）解析并去 git ls-remote（实测 rc=128）。
          npm publish ./dist/npm-cli --provenance 2>&1 | tee "$log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::npm publish rfb-cli 失败 rc=$rc（尾部见注解）"
            bash scripts/ci-annotate.sh release-npm-cli "$log" 2000
            exit "$rc"
          fi
