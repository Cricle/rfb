name: Release

on:
  push:
    tags: ['v*.*.*']

# Replace this explicit placeholder with the repository's actual owner/name before enabling releases.
env:
  GITHUB_REPOSITORY: PLACEHOLDER_GITHUB_REPOSITORY

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate repository and tag
        env:
          TAG: ${{ github.ref_name }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" != "PLACEHOLDER_GITHUB_REPOSITORY" || { echo 'Configure GITHUB_REPOSITORY placeholder before release.' >&2; exit 1; }
          test "$ACTUAL_REPOSITORY" = "$GITHUB_REPOSITORY"
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(x["version"] for x in json.load(sys.stdin)["packages"] if x["name"] == "rfb"))')
          test "$TAG" = "v$VERSION"
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_PROPAGATION_SECONDS: '30'
        run: bash scripts/release.sh
      - name: Build CLI
        run: cargo build -p rfb --features cli --release
      - name: Package and checksum
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/rfb-cli dist/rfb-cli
          (cd dist && sha256sum rfb-cli > SHA256SUMS)
          echo "artifact=rfb-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"
          tar -C dist -czf "dist/rfb-${TAG}.tar.gz" rfb-cli SHA256SUMS
          sha256sum "dist/rfb-${TAG}.tar.gz" >> dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.GITHUB_REPOSITORY }}
          files: |
            dist/${{ steps.package.outputs.artifact }}
            dist/SHA256SUMS
          generate_release_notes: true
