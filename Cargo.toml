[workspace]
members = ["rfb", "rfb-adk", "rfb-runtime", "ben"]
# tui/ 是独立 crate（TUI 依赖树不进 CI 门禁）。
exclude = ["tui"]
resolver = "2"

[workspace.package]
version = "0.0.4"
edition = "2021"
# 1.95：adk-rust 2.2（rfb-adk）要求 edition 2024。
rust-version = "1.95"
license = "MIT OR Apache-2.0"
# Replace before publishing this workspace.
repository = "https://github.com/Cricle/rfb"

# Workspace-internal dependency requirements: ONE version requirement per
# crate, inherited by every member through `<dep>.workspace = true`. Members
# only declare their own deltas (optional, extra features).
[workspace.dependencies]
rfb-runtime = { path = "rfb-runtime", version = "0.0.4", default-features = false, features = ["core"] }
rfb = { package = "rfb-sdk", path = "rfb", version = "0.0.4" }

[profile.dev]
opt-level = 0
# 行号表足够的调试信息：panic 回溯仍带 file:line，但生成与链接的调试段
# 大幅缩水（--all-features 下 90+ 测试二进制每个都要链进 rustpython 等大件）。
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
